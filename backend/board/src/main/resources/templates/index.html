<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>index</title>
</head>
<body>
    <button onclick="saveReq()">글작성</button>
    <a href="/board/save">글작성(링크)</a>
    <button onclick="listReq()">글목록</button>
    <button onclick="pagingReq()">페이징목록</button>

    <h2>Hello Spring Boot!!</h2>
    <div sec:authorize="isAuthenticated()">
        <p th:text="${#authentication.name} + '님 로그인중'"></p>
    </div>

    <a sec:authorize="isAnonymous()" href="/member/save">회원가입</a>
    <a sec:authorize="isAnonymous()" href="/member/login">로그인</a>

    <a sec:authorize="isAuthenticated()" href="/member/logout">로그아웃</a>
    <a sec:authorize="isAuthenticated()" href="/member/update">내 정보 수정하기</a>
    <a sec:authorize="isAuthenticated()" href="/board/myList">내가 작성한 글</a>

    <a href="/member/">회원목록</a>
</body>
<script>
//  function saveReq() {
//
//  }

  const saveReq = () => {
    location.href = "/board/save";
  }
  const listReq = () => {
    location.href = "/board/";
  }
  const pagingReq = () => {
    location.href = "/board/paging";
  }


</script>
</html>
