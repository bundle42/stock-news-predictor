<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>index</title>
</head>
<body>
    <button onclick="saveReq()">글작성</button>
    <a href="/board/save">글작성(링크)</a>
    <button onclick="listReq()">글목록</button>
    <button onclick="pagingReq()">페이징목록</button>

    <h2>Hello Spring Boot!!</h2>
    <div th:if="${session.loginEmail != null}">
        <p th:text="${session.loginEmail} + '님 로그인중'"></p>
    </div>

    <a href="/member/save">회원가입</a>
    <!-- 로그인 안 된 경우 -->
    <a th:if="${session.loginId == null}" href="/member/login">로그인</a>
    <!-- 로그인 된 경우 -->
    <a th:if="${session.loginId != null}" href="/member/logout">로그아웃</a>
    <a th:if="${session.loginId != null}" href="/board/myList">내가 작성한 글</a>
    <a href="/member/">회원목록</a>
</body>
<script>
//  function saveReq() {

//  }

  const saveReq = () => {
    location.href = "/board/save";
  }
  const listReq = () => {
    location.href = "/board/";
  }
  const pagingReq = () => {
    location.href = "/board/paging";
  }


</script>
</html>
