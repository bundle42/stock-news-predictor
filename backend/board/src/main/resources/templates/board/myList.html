<table>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성일</th>
        <th>조회수</th>
    </tr>
    <tr th:each="board : ${boardList}">
        <td th:text="${board.id}"></td>
        <td><a th:href="@{|/board/${board.id}?page=1|}" th:text="${board.boardTitle}"></a></td>
        <td th:text="${board.boardCreatedTime}"></td>
        <td th:text="${board.boardHits}"></td>
    </tr>
</table>
