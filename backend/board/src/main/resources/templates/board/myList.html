<table>
    <tr>
        <th>번호</th>
        <th>제목</th>
        <th>작성일</th>
        <th>조회수</th>
    </tr>

    <tr th:each="board : ${boardList}">
        <td th:text="${board.id}"></td>

        <td>
            <a th:href="@{'/board/' + ${board.id}}"
               th:text="${board.boardTitle}"></a>
        </td>

        <td th:text="${#temporals.format(board.boardCreatedTime,'yyyy-MM-dd HH:mm')}"></td>

        <td th:text="${board.boardHits}"></td>
    </tr>
</table>
