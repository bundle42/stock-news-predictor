name: Spring Deploy

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Spring
        run: |
          ./gradlew clean build -x test

      - name: Upload jar & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/news-backend
            git pull origin develop
            # 기존 Spring 완전 종료
            pkill -f board-0.0.1-SNAPSHOT.jar || true
            # build
            ./gradlew clean build -x test
            # 실행
            nohup java -jar build/libs/board-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
